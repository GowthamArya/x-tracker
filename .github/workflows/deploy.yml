name: Build and Deploy Angular and Web API

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Angular dependencies
        working-directory: client
        run: npm ci

      - name: Build Angular
        working-directory: client
        run: npm run build -- --configuration production

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Web API
        working-directory: Server
        run: dotnet restore

      - name: Build Web API
        working-directory: Server
        run: dotnet build --configuration Release --no-restore

      - name: Publish Web API
        working-directory: Server
        run: dotnet publish --configuration Release --no-build --output ../api-publish

      - name: Prepare Angular deployment
        run: |
          rm -rf deploy
          mkdir deploy

          DIST_DIR=$(find client/www -type f -name "index.html" -print -quit | xargs -r dirname)

          if [ -z "$DIST_DIR" ]; then
            echo "Angular index.html was not found"
            exit 1
          fi

          cp -R "$DIST_DIR"/. deploy/
          cp client/web.config deploy/web.config

      - name: Deploy Angular to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /wwwroot/
          local-dir: ./deploy/

      - name: Deploy Web API to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_API_SERVER_DIR }}
          local-dir: ./api-publish/