name: Deploy Angular to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: client
        run: npm ci

      # 4. Build Angular application
      - name: Build Angular application
        working-directory: client
        run: npm run build -- --configuration production

      # 5. Show Angular build output
      - name: Show Angular build output
        run: |
          echo "=== Angular www directory ==="
          find client/www -maxdepth 4 -type f | head -100

      # 6. Prepare deployment
      - name: Prepare deployment
        run: |
          rm -rf deploy
          mkdir deploy

          # Find index.html inside Angular's configured output directory
          DIST_DIR=$(find client/www -type f -name "index.html" -print -quit | xargs -r dirname)

          if [ -z "$DIST_DIR" ]; then
            echo "ERROR: Angular index.html was not found inside client/www"
            exit 1
          fi

          echo "Angular build directory: $DIST_DIR"

          cp -R "$DIST_DIR"/. deploy/

          echo "=== Deployment files ==="
          find deploy -maxdepth 2 -type f

      # 7. Deploy to MonsterASP
      - name: Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /wwwroot/
          local-dir: ./deploy/