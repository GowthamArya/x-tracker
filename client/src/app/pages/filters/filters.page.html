<ion-card class="filter-card">
  <ion-card-content>
    <div class="filter-header">
      <h3>Refine results</h3>
      <p>Choose the slice of data you want to look at.</p>
    </div>

    <div class="filter-grid">
      <div class="field-group">
        <label class="field-label">
          <ion-icon name="swap-vertical-outline"></ion-icon>
          <span>Type</span>
        </label>
        <ion-select
          class="filter-select"
          [(ngModel)]="selectedCategoryType"
          (ionChange)="onCategoryTypeChange()"
          interface="popover"
          placeholder="All types">
          <ion-select-option [value]="null">All Types</ion-select-option>
          <ion-select-option value="income">Income</ion-select-option>
          <ion-select-option value="expense">Expense</ion-select-option>
        </ion-select>
      </div>

      <div class="field-group">
        <label class="field-label">
          <ion-icon name="calendar-outline"></ion-icon>
          <span>Date range</span>
        </label>
        <ion-select
          class="filter-select"
          [(ngModel)]="selectedPreset"
          (ionChange)="onPresetChange()"
          interface="popover"
          placeholder="This month">
          <ion-select-option value="thisMonth">This Month</ion-select-option>
          <ion-select-option value="lastMonth">Last Month</ion-select-option>
          <ion-select-option value="thisYear">This Year</ion-select-option>
          <ion-select-option value="lastYear">Last Year</ion-select-option>
          <ion-select-option value="custom">Custom Range</ion-select-option>
        </ion-select>
      </div>

      <div *ngIf="showCategory" class="field-group">
        <label class="field-label">
          <ion-icon name="pricetags-outline"></ion-icon>
          <span>Category</span>
        </label>
        <ion-select
          class="filter-select"
          [(ngModel)]="selectedCategoryId"
          (ionChange)="onCategoryChange()"
          interface="popover"
          placeholder="All categories">
          <ion-select-option [value]="null">All Categories</ion-select-option>
          <ion-select-option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </ion-select-option>
        </ion-select>
      </div>
    </div>

    <div *ngIf="selectedPreset === 'custom'" class="custom-date-grid">
      <div class="field-group">
        <label class="field-label">
          <ion-icon name="calendar-outline"></ion-icon>
          <span>From</span>
        </label>
        <ion-item lines="none" class="date-filter-item">
          <ion-datetime-button datetime="fromPicker"></ion-datetime-button>
        </ion-item>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              id="fromPicker"
              presentation="date"
              [(ngModel)]="customFrom"
              (ionChange)="onCustomDateChange()">
            </ion-datetime>
          </ng-template>
        </ion-modal>
      </div>

      <div class="field-group">
        <label class="field-label">
          <ion-icon name="calendar-outline"></ion-icon>
          <span>To</span>
        </label>
        <ion-item lines="none" class="date-filter-item">
          <ion-datetime-button datetime="toPicker"></ion-datetime-button>
        </ion-item>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              id="toPicker"
              presentation="date"
              [(ngModel)]="customTo"
              (ionChange)="onCustomDateChange()">
            </ion-datetime>
          </ng-template>
        </ion-modal>
      </div>
    </div>
  </ion-card-content>
</ion-card>
