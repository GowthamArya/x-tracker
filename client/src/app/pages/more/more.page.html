<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>More</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="more-page">

    <!-- Account -->
    <section class="section">

      <ion-list inset="true">

        <ion-item
          button
          detail="true"
          routerLink="/tabs/accounts"
        >
          <ion-icon
            name="wallet-outline"
            slot="start"
            color="primary">
          </ion-icon>

          <ion-label>
            <h2>Accounts</h2>
            <p>Manage your bank and cash accounts</p>
          </ion-label>
        </ion-item>

      </ion-list>

    </section>


    <!-- Preferences -->
    <section class="section">

      <ion-list inset="true">

        <ion-list-header>
          <ion-label>Preferences</ion-label>
        </ion-list-header>

        <ion-item button detail="true" routerLink="/tabs/transactions">
          <ion-icon
            name="notifications-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            <h2>Notifications</h2>
            <p>View alerts and reminders</p>
          </ion-label>
        </ion-item>


        <ion-item button detail="true" routerLink="/tabs/reports">
          <ion-icon
            name="color-palette-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            <h2>Appearance</h2>
            <p>Choose the UI style and chart colors</p>
          </ion-label>
        </ion-item>

      </ion-list>

    </section>


    <!-- Security -->
    <section class="section">

      <ion-list inset="true">

        <ion-list-header>
          <ion-label>Security</ion-label>
        </ion-list-header>

        <ion-item button detail="true" routerLink="/tabs/dashboard">
          <ion-icon
            name="shield-checkmark-outline"
            slot="start"
            color="success">
          </ion-icon>

          <ion-label>
            <h2>Security</h2>
            <p>Review auth settings and session status</p>
          </ion-label>
        </ion-item>

      </ion-list>

    </section>


    <!-- Logout -->
    <section class="section logout-section">

      <ion-list inset="true">

        <ion-item
          button
          detail="false"
          class="logout-item"
          (click)="logout()"
        >
          <ion-icon
            name="log-out-outline"
            slot="start"
            color="danger">
          </ion-icon>

          <ion-label color="danger">
            <h2>Sign out</h2>
          </ion-label>

        </ion-item>

      </ion-list>

    </section>


    <div class="app-version">
      X-Tracker · v1.0.0
    </div>

  </div>

</ion-content>
