<ion-header class="app-header"><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/trips"></ion-back-button></ion-buttons><ion-title>Share trip</ion-title></ion-toolbar></ion-header>
<ion-content>
  <app-page-refresher></app-page-refresher>
  <div class="page-container">
    <div class="invite-card">
      <h2>Invite people to</h2>
      <h3>{{ invite?.tripName || 'this trip' }}</h3>

      <div class="qr-area" *ngIf="invite">
        <ion-button fill="clear" (click)="qrOpen = true"><img [src]="qrUrl" alt="Invite QR" /></ion-button>
        <div class="qr-caption">Tap to enlarge · Scan to join</div>
      </div>

      <div class="invite-actions">
        <ion-button (click)="create()">Generate Invite</ion-button>
        <ion-button (click)="copy()" [disabled]="!invite">Copy Link</ion-button>
        <ion-button (click)="share()" [disabled]="!invite">Share</ion-button>
        <ion-button color="danger" (click)="revoke()" *ngIf="invite && invite.isActive">Revoke Invite</ion-button>
      </div>

      <div class="invite-link" *ngIf="invite">
        <label>Invite link</label>
        <textarea readonly>{{ inviteUrl }}</textarea>
      </div>
    </div>
  </div>
  <ion-modal [isOpen]="qrOpen" (didDismiss)="qrOpen = false"><ng-template><ion-content class="ion-padding"><ion-button fill="clear" (click)="qrOpen = false">Close</ion-button><img [src]="qrUrl" alt="Trip invite QR code" style="display:block;width:100%;max-width:320px;margin:40px auto" /></ion-content></ng-template></ion-modal>
</ion-content>
