<ion-header class="ion-no-border navbar-header">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/trips"></ion-back-button>
    </ion-buttons>
    <ion-title>Trip Members</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-page-refresher></app-page-refresher>
  <div class="page-container members-list">

    <div class="add-member-card">
      <h3>Add Member by Name (Guest)</h3>
      <div class="add-row">
        <ion-input [(ngModel)]="guestName" placeholder="e.g. Rahul Sharma"></ion-input>
        <ion-button (click)="addGuest()">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Add Guest
        </ion-button>
      </div>
    </div>

    <div class="add-member-card">
      <h3>Add Member by User ID</h3>
      <div class="add-row">
        <ion-input type="number" [(ngModel)]="userIdToAdd" placeholder="User ID"></ion-input>
        <ion-button fill="outline" (click)="addExistingUser()">Link User</ion-button>
      </div>
    </div>

    <div class="member-cards">
      <div class="member-card" *ngFor="let m of members">
        <div class="avatar">{{ (m.name || 'M')[0] | uppercase }}</div>
        <div class="member-info">
          <div class="name">{{ m.name }}</div>
          <div class="email" *ngIf="m.email">{{ m.email }}</div>
          <div class="linked" *ngIf="m.userId">Linked account</div>
          <div class="guest" *ngIf="!m.userId">Virtual / Guest member</div>
        </div>
        <ion-button *ngIf="canRemove(m)" fill="clear" color="danger" size="small" [attr.aria-label]="'Remove ' + m.name" (click)="confirmRemove(m)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>

  </div>
</ion-content>
