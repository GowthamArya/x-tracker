<ion-header class="app-header"><ion-toolbar><ion-title>Page not found</ion-title></ion-toolbar></ion-header>
<ion-content [fullscreen]="true">
  <main class="not-found-page">
    <p class="code">404</p>
    <h1>That page is not here.</h1>
    <p>The link may be outdated or the page may have moved.</p>
    <ion-button routerLink="/">Return to x-tracker</ion-button>
    <a routerLink="/contact-us">Contact support</a>
  </main>
</ion-content>
