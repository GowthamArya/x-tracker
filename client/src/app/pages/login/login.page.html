<ion-content [fullscreen]="true">

  <div class="login-container">

    <div class="login-header">
      <h1>X-Tracker</h1>

      <p>
        Track your finances simply.
      </p>
    </div>

    <div class="login-actions">

      <ion-button
        expand="block"
        size="large"
        (click)="loginWithGoogle()"
      >
        Continue with Google
      </ion-button>

    </div>

  </div>

</ion-content>
