<ion-header class="app-header"><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/login"></ion-back-button></ion-buttons><ion-title>Join trip</ion-title></ion-toolbar></ion-header>
<ion-content>
  <ion-list>
    <ion-item *ngIf="loading">
      <ion-spinner></ion-spinner>
    </ion-item>

    <ion-item *ngIf="error">
      <ion-label>{{ error }}</ion-label>
    </ion-item>

    <ion-item *ngIf="invite && !loading">
      <ion-label>
        <h3>Join {{ invite.tripName || 'this trip' }}</h3>
        <p *ngIf="!isLoggedIn">Sign in to join this trip. After authentication, you’ll return here automatically.</p>
      </ion-label>
    </ion-item>

    <ion-item *ngIf="invite && !loading">
      <ion-button *ngIf="!isLoggedIn" (click)="login()">Login to Join</ion-button>
      <ion-button *ngIf="isLoggedIn" (click)="join()">Join Trip</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
